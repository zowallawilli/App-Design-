# Spiegelt die Tiroler Abflusspegel (hydro.tirol.gv.at, ohne CORS) in den Branch "pegeldaten",
# damit die App sie über raw.githubusercontent.com abrufen kann. Kostenlos (öffentliches Repo).
name: Pegel Tirol spiegeln

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pegel-tirol
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abrufen und kürzen
        run: |
          curl -sSf --retry 3 --max-time 60 "https://hydro.tirol.gv.at/stationdata/data.json?parameter=Wasserstand" -o /tmp/raw.json
          mkdir -p /tmp/out
          node scripts/tirol-mirror.mjs /tmp/raw.json > /tmp/out/tirol.json
      - name: In Branch pegeldaten ablegen
        run: |
          cd /tmp/out
          git init -q -b pegeldaten
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tirol.json
          git commit -qm "Pegel Tirol $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pegeldaten
